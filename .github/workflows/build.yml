name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache vendor frameworks
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vendor-${{ hashFiles('tools/fetch-vendor.sh') }}

      - name: Fetch TorrServerKit
        run: bash tools/fetch-vendor.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}

      - name: Build
        run: |
          xcodebuild \
            -project LampaPlayer.xcodeproj \
            -scheme LampaPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -100 || true
          if [ "$STATUS" -ne 0 ]; then tail -40 build.log; exit "$STATUS"; fi
          test -f build/Build/Products/Release-iphoneos/LampaPlayer.app/LampaPlayer

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LampaPlayer.app Payload/
          # Статические фреймворки уже вшиты в бинарник; если Xcode всё же положил их во Frameworks,
          # iOS откажется ставить приложение («не динамическая библиотека»).
          for fw in Payload/LampaPlayer.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            bin="$fw/$(basename "$fw" .framework)"
            if [ -f "$bin" ] && file "$bin" | grep -q "ar archive"; then
              echo "Removing static framework $fw"
              rm -rf "$fw"
            fi
          done
          ls Payload/LampaPlayer.app/Frameworks 2>/dev/null || echo "no Frameworks dir"
          PLIST=Payload/LampaPlayer.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          NAME="LampaPlayer-$VERSION-$BUILD-unsigned.ipa"
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LampaPlayer-unsigned-ipa
          path: ${{ env.IPA_NAME }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION-$APP_BUILD"
          gh release create "$TAG" "$IPA_NAME" \
            --target "$GITHUB_SHA" \
            --title "$APP_VERSION ($APP_BUILD)" \
            --notes "$(git log -1 --pretty=%B "$GITHUB_SHA" | grep -v '^Co-Authored-By')" \
            --latest

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
