name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build
        run: |
          xcodebuild \
            -project LampaPlayer.xcodeproj \
            -scheme LampaPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -100 || true
          if [ "$STATUS" -ne 0 ]; then tail -40 build.log; exit "$STATUS"; fi
          test -f build/Build/Products/Release-iphoneos/LampaPlayer.app/LampaPlayer

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LampaPlayer.app Payload/
          PLIST=Payload/LampaPlayer.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")
          NAME="LampaPlayer-$VERSION-$BUILD-unsigned.ipa"
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: LampaPlayer-unsigned-ipa
          path: ${{ env.IPA_NAME }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
