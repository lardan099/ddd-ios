name: Screenshots

# Только вручную: Actions → Screenshots → Run workflow. Собирает приложение под iOS-симулятор,
# снимает экраны (tools/screenshots.sh) и коммитит их в docs/screenshots с [skip ci].
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache vendor frameworks
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vendor-${{ hashFiles('tools/fetch-vendor.sh') }}

      - name: Fetch TorrServerKit
        run: bash tools/fetch-vendor.sh

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}

      - name: Build for simulator
        run: |
          xcodebuild \
            -project LampaPlayer.xcodeproj \
            -scheme LampaPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- \
            build > build.log 2>&1 && STATUS=0 || STATUS=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -100 || true
          if [ "$STATUS" -ne 0 ]; then tail -40 build.log; exit "$STATUS"; fi
          test -d build/Build/Products/Debug-iphonesimulator/LampaPlayer.app

      - name: Take screenshots
        run: bash tools/screenshots.sh build/Build/Products/Debug-iphonesimulator/LampaPlayer.app docs/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots
            screenshot-logs
            build.log

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Скриншоты не изменились"; exit 0; fi
          git commit -m "Скриншоты для README [skip ci]"
          # Пока снимали, в main могли запушить — подтягиваем (скриншоты ни с чем не конфликтуют).
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
